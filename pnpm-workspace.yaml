packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
overrides:
  # drizzle-kit's legacy @esbuild-kit loader pins esbuild 0.18.
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # exceljs 4.4.0 (latest) pins uuid 8.
  "exceljs>uuid": "^11.1.1"
  # typescript-estree pins minimatch 10 (DoS advisory, fixed in 11.0.1).
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
