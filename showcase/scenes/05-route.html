<!doctype html><meta charset=utf-8><link rel=stylesheet href="base.css"><style>
body{background:#fff;color:#14142b;display:grid;place-items:center}
.wrap{width:1560px;display:grid;gap:120px}
.title{font-size:64px;text-align:center;font-weight:650;letter-spacing:-.025em}
.route{position:relative;display:grid;grid-template-columns:repeat(6,1fr)}
.line{position:absolute;left:calc(100%/12);right:calc(100%/12);top:23px;height:4px;background:#e4e6f5;border-radius:2px}
.fill{position:absolute;left:calc(100%/12);top:23px;height:4px;width:0;background:#1c1f8f;border-radius:2px;animation:grow 5s linear forwards .5s}
@keyframes grow{to{width:calc(100%*5/6)}}
.s{position:relative;display:grid;justify-items:center;gap:22px;text-align:center}
.dot{width:50px;height:50px;border-radius:50%;background:#fff;border:4px solid #c3c8ee;opacity:.0;animation:on .4s ease forwards}
.s:nth-child(3) .dot{animation-delay:.3s}.s:nth-child(4) .dot{animation-delay:1.3s}.s:nth-child(5) .dot{animation-delay:2.3s}
.s:nth-child(6) .dot{animation-delay:3.3s}.s:nth-child(7) .dot{animation-delay:4.3s}.s:nth-child(8) .dot{animation-delay:5.3s}
@keyframes on{0%{opacity:1;border-color:#c3c8ee;transform:scale(1)}100%{opacity:1;border-color:var(--c);background:var(--c);transform:scale(1.0)}}
.s .dot{opacity:1}
.lab{font-size:34px;font-weight:650;letter-spacing:-.015em;opacity:.35;animation:lab .4s ease forwards}
.who{font-size:26px;color:#5b5f86;opacity:.35;animation:lab .4s ease forwards}
.s:nth-child(3) :is(.lab,.who){animation-delay:.3s}.s:nth-child(4) :is(.lab,.who){animation-delay:1.3s}.s:nth-child(5) :is(.lab,.who){animation-delay:2.3s}
.s:nth-child(6) :is(.lab,.who){animation-delay:3.3s}.s:nth-child(7) :is(.lab,.who){animation-delay:4.3s}.s:nth-child(8) :is(.lab,.who){animation-delay:5.3s}
@keyframes lab{to{opacity:1}}
.cap{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:44px;font-weight:500;color:#2c2f66}
</style>
<div class=wrap><div class=title>Dari draft sampai terkunci</div>
<div class=route><div class=line></div><div class=fill></div>
<div class=s style="--c:#8a8fa8"><div class=dot></div><div class=lab>Draft</div><div class=who>Requestor mengisi</div></div>
<div class=s style="--c:#3a9ad6"><div class=dot></div><div class=lab>Konsolidasi</div><div class=who>Default Owner memeriksa</div></div>
<div class=s style="--c:#4a45c9"><div class=dot></div><div class=lab>Persetujuan Divisi</div><div class=who>Division Owner menyetujui</div></div>
<div class=s style="--c:#d99a1f"><div class=dot></div><div class=lab>Review Finance</div><div class=who>Finance mereview</div></div>
<div class=s style="--c:#8a3fc9"><div class=dot></div><div class=lab>Menunggu Kunci</div><div class=who>Finance mengunci</div></div>
<div class=s style="--c:#2faa78"><div class=dot></div><div class=lab>Terkunci</div><div class=who>Hanya dibaca</div></div>
</div></div>
<div class=cap>Setiap tahap punya pemegangnya.</div>
