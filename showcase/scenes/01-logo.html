<!doctype html><meta charset=utf-8><link rel=stylesheet href="base.css"><style>
body{background:#1c1f8f;color:#fff;display:grid;place-items:center}

<div class=stack>

<div class=cap>Platform manajemen bisnis enterprise yang menyatukan penjualan, proyek, anggaran, pengadaan, layanan purnajual, dan SDM dalam satu sistem.</div>
